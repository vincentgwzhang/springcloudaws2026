spring.application.name=awsdemo1

# Service clients are configured explicitly because Spring Cloud AWS 3.4.0
# auto-configuration is not compatible with Spring Boot 4.1.0.
spring.cloud.aws.autoconfigure.enabled=false

# Individual AWS service configurations (disabled by default)
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.sqs.enabled=true

# Queue used by SQSController. On EC2, set SQS_QUEUE_URL in the instance
# environment and grant the instance profile permission to send to this queue.
app.aws.sqs.queue-url=https://sqs.eu-west-1.amazonaws.com/232100206199/xray-poc-queue

# Note: To enable SQS/S3, provide AWS credentials via:
# - AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables
# - ~/.aws/credentials file
# - IAM role (on EC2/ECS)
# Then set the corresponding spring.cloud.aws.*.enabled=true
